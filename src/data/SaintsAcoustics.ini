[Reverb]
; Enables sound processing through EAX+DSOAL.
bEnabled=1
; Master processed sound (wet) level in dB. 0 = preset level, positive = more, negative = less.
fWetLevel=0.0
; Boost every environment's room level in dB. 
; I3DL2 preset set to -10 dB. +10 adds up to 0 dB (max level).
fRoomBoost=0.0
; Key to toggle all sound processing. (Default: End)
iBypassKey=0x23
; Environment used when a cell or worldspace has no set acoustic space.
; Names: Generic PaddedCell Room Bathroom Livingroom StoneRoom Auditorium ConcertHall Cave Arena Hangar
;        CarpetedHallway Hallway StoneCorridor Alley Forest City Mountains Quarry Plain ParkingLot SewerPipe
;        Underwater SmallRoom MediumRoom LargeRoom MediumHall LargeHall Plate
sInteriorFallback=MediumRoom
sExteriorFallback=City

[Sends]
; How much of each sound category goes into the reverb, in dB. 0 = full, -100 = none.
; UI sounds, ambient music and Pip-Boy radio are excluded by default.

; Voice lines spoken into the world (outside of dialogue).
fVoice3D=0.0
; Voice lines spoken in dialogue or by the player in 1st person.
fVoice2D=0.0
; Gunshots, reloads, weapon handling, casings.
fWeapons=0.0
; Player and NPC footstep sounds.
fFootsteps=-2.0
; Placed ambient sound emitters (buzzing, humming, water, machinery).
fLoops3D=-6.0
; Ambient sounds playing in 2D space (ambience, wind).
fLoops2D=-100.0
; Regional sounds (ambience).
fRegion=-100.0
; Radios placed in the world (host voices and songs). The Pip-Boy radio is always excluded.
fRadio3D=0.0
; All other sound categories playing in world space.
fDefault3D=0.0
; All other sound categories playing in 2D.
fDefault2D=0.0

[VoiceFilters]
; Filters voices spoken through face covers: cloth masks, gas masks, power armor helmets and intercoms.
; DSOAL does not support the vanilla voice modulation effect anyway, this is a net positive.
bEnabled=1

[Debug]
; Override for environment selection (empty = off). Use something like "Hangar" for a max ear-blasting reverb.
sForceEnvironment=
; Log what OpenAL Soft stores in FX slot 0 and the first n routed sounds, for debugging.
iReadbackCount=0
; Log every sound played by the engine. May be useful for mod pack debugging, too.
bLogSoundPlay=0
; Log every new sound environment on cell change.
bLogSoundEnvironment=0
; Scan the first n played sounds for DirectSound objects, for layout debugging.
iLayoutProbeCount=0
; Defer EAX sound sets, try to batch set calls together into one for a performance plus.
bDeferEaxSets=0
; Log performance metrics on EAX routes, for debugging.
bLogRouteTiming=0
; Log the face cover of every speaking NPC and the items on its head.
bLogVoiceCover=1