[Sources]
; Factor on the distances over which the engine fades out 3D sounds. 1.0 = vanilla, 2.0 = sounds carry twice as far.
fDistanceAttenuationFactor=1.5
; Level modifier for radios playing in worldspace (not Pip-Boy radio), in dB. (Default: 0.0 = 100%)
fRadioLevel=3.5
; Level modifier for ambience sounds (regional sounds, wind, crickets, emitters), in dB. (Default: 0.0 = 100%)
fAmbienceLevel=-2.0
; Level modifier for explosions (grenades, mines, artillery, mini nukes), in dB. (Default: 0.0 = 100%)
fExplosionsLevel=2.0

[Spatialization]
; Enables sound processing through EAX+DSOAL. Levels in [Sources] need it too.
bEnabled=1
; Master processed sound (wet) level in dB. 0 = preset level, negative = less.
fWetLevel=0.0

; Environment Presets:
;
; Generic PaddedCell Room Bathroom Livingroom StoneRoom Auditorium ConcertHall Cave Arena Hangar
; CarpetedHallway Hallway StoneCorridor Alley Forest City Mountains Quarry Plain ParkingLot SewerPipe
; Underwater SmallRoom MediumRoom LargeRoom MediumHall LargeHall Plate

; Environment used as fallback for interior cells.
sInteriorFallback=LargeRoom

; Environment used as fallback for exterior worldspaces.
sExteriorFallback=City

; Key to toggle all sound processing. (Default: 0xCF = End)
iBypassKey=0xCF

; How much of each sound category goes into the reverb, in dB. 0 = full, -100 = none.
; UI sounds and ambient music are always excluded.

; Voice lines spoken into the world (outside of dialogue).
fVoice3D=0.0
; Voice lines spoken in dialogue or by the player in 1st person.
fVoice2D=0.0
; Gunshots, reloads, weapon handling, casings.
fWeapons=0.0
; Player and NPC footstep sounds.
fFootsteps=0.0
; Placed ambient sound emitters (buzzing, humming, water, machinery).
fLoops3D=0.0
; Ambient sounds playing in 2D space (ambience, wind).
fLoops2D=-100.0
; Regional sounds (ambience).
fRegion=-100.0
; Radios placed in the world (host voices and songs).
fRadio3D=0.0
; Pip-Boy radio (host voices and songs) and holotapes played on the Pip-Boy.
fRadio2D=-6.0
; All other sound categories playing in world space.
fDefault3D=0.0
; All other sound categories playing in 2D.
fDefault2D=0.0

[Occlusion]
; Enables raycast-based occlusion probing to muffle sounds behind occluders (e.g. walls, buildings, vehicles, terrain).
; Supports all sound sources, including moving sources (like NPCs) and long-playing sources (like radios).
bEnabled=1
; Key to turn occlusion off and on (0 = no key). 0xD1 = Page Down.
iBypassKey=0
; High-frequency attenuation in dB for each wall layer between player and sound source.
; Seams, back-to-back walls and a door in its frame count as one layer.
fWallLevel=8.0
; Maximum possible attenuation from occlusion in dB.
fMaxOcclusion=60.0
; Share of attenuation on low frequencies and reverb.
fLFRatio=0.25
; Share of attenuation on the reverb output.
fRoomRatio=1.0
; Minimum size for an object to be considered for occlusion (statics, containers, furniture, activators) (doors always occlude).
fMinOccluderSize=128
; Sounds further away (game units) are not checked.
fMaxDistance=4096
; Ray casts per frame (a single ray cast is typically 1-2 µs).
iRayBudget=128
; Seconds between two checks of the same sound.
fRefreshInterval=0.1
; Seconds to muffle a sound getting occluded.
fAttackTime=0.5
; Seconds to unmuffle a sound getting unoccluded.
fReleaseTime=0.5

[Impacts]
; Removes the reverb tail baked into gunshot sounds before they play.
; A sound is considered a gunshot if they sit in "sound\fx\wpn\" and have "_fire" in the name.
bDeverb=1
; Share of the sound to keep at most. The rest is cut.
fKeepFraction=0.5
; Fade starts once the level stays this many dB below the peak (for 20 ms).
fFadeThreshold=8.0
; Latest fade start in seconds after the peak.
fMaxFadeDelay=0.25
; Fade steepness in dB per second.
fDecayRate=85
; If a gunshot sound has a second peak after its initial one, deverb will be skipped (indicates non-regular/non-gunshot sound).
fRepeatRejectLevel=6.0

; Adds a secondary reverb layer to impact sounds (gunfire and explosions) in exteriors.
; Mimics how gunfire is much louder in reality than played back in game, ergo, producing more echo.
; A sound is considered an explosion if they sit in "sound\fx\fx\explosion\" (excluded from extra reverb).
bExteriorTail=1
; Decay factor for impact sounds (roughly the maximum reverb time).
fTailDecayFactor=6.0
; Seconds added to the preset reflections delay (e.g. echoing from walls).
fTailReflectionsDelay=0.25
; Factor on the preset diffusion. Lower: more distinct echoes.
fTailDiffusionFactor=0.85
; Factor on the preset high-frequency decay ratio. Lower: duller tail.
fTailHFRatioFactor=0.75
; Level added to the preset late reverb level, in dB. Allows up to +20 dB in total.
fTailLateLevel=6.0
; Send level of impact sound tails near the player or in 1st person, in dB. 
fTailNearSend=0.0
; Send level of impact sound tails far away from the player, in dB.
fTailFarSend=0.0
; Distance at which a n impact sound is considered "near", in game units.
fTailNearDistance=1024
; Distance at which a n impact sound is considered "far", in game units.
fTailFarDistance=8192

; Applies attenuation to consecutive impact sounds (e.g. automatic gunfire).
; Effectively lets the first gunshot get full volume but gradually lowers subsequent shots for ease of hearing.
; Only applies to impact sounds played in 2D (1st person, player-initiated).
bThresholdShift=1
; Seconds of continuous sounds until maximum attenuation is reached (100% of `fThresholdShiftAttenuation` applied).
fThresholdShiftAttack=0.5
; Seconds after the last impact sound has stopped playing to start recovering attenuation (going back to full volume).
fThresholdShiftSustain=0.25
; Seconds for attenuation to fully decay (going back to full volume).
fThresholdShiftDecay=1.0
; Level applied to impact sounds at full attenuation, in dB.
fThresholdShiftAttenuation=-4.0

[Vocals]
; Filters voices spoken through face covers: cloth masks, gas masks, power armor helmets and intercoms.
; DSOAL does not support the vanilla voice modulation effect anyway, this is a net positive.
bEnabled=1
; Filters holotapes played on the Pip-Boy like an old tape: narrow band, saturation, hiss and wow and flutter.
; Replaces the speaker filter that holotapes get when JIP's bVoiceModulationFix marks them as modulated.
bHolotapeFilter=1

[Fixes]
; In vanilla doors and containers play their open/close sound twice: once 2D on use and typically again in 3D from the animation.
; This setting mutes the 2D sound for doors that are expected to have an animation (doors that play a sound that aren't level changers).
bFixDoubleOpenCloseSounds=1

; The Pip-Boy shows a holotape's total time shorter than it plays. Seconds added to that total, from -10 to +30.
; Only changes the time and progress display, not playback.
fHolotapeDurationOffset=2.0

[Debug]
; Key that reloads the config from disk in-game (0 = off). 0xD2 = Insert.
; These keys need a restart: [Occlusion] bEnabled, [Vocals] bEnabled, [Fixes] bFixDoubleOpenCloseSounds,
; and in [Debug] bLogSoundEnvironment, bProbeSoundRequests, bProbeSoundUpdate, iTestOcclusion, bProbePickThreads.
iReloadKey=0xD2
; Override for environment selection (empty = off). Use something like "Hangar" for a max level ear-blasting (or caressing) reverb.
sForceEnvironment=
; Log what OpenAL Soft stores in primary fx slot and the first number of routed sounds.
iReadbackCount=0
; Log every sound played by the engine. Also useful for mod pack debugging.
bLogSoundPlay=0
; Log every new sound environment set, on cell change.
bLogSoundEnvironment=0
; Scan the first number of played sounds for DirectSound objects, for object layout debugging.
iLayoutProbeCount=0
; Defer EAX sound sets to batch them into one commit, for performance.
bDeferEaxSets=0
; Log performance metrics on EAX routes.
bLogRouteTiming=0
; Log worn and face covering items of speaking NPCs, for voice filter debugging.
bLogVoiceCover=0
; Log gunshot once per encounter, de-verbed/skipped with trace. Logs tail send of impacts.
bLogGunshots=0

; Debug key to cast rays from camera along view and log hits along path (0 = off). 0xC7 = Home.
iRayProbeKey=0
; Ray layers to test with one pass each. 37 = LineOfSight, 1 = Static, 6 = Projectile.
sRayProbeLayers=37, 1, 6
; Ray length in game units.
fRayProbeRange=4096
; Log which threads request sounds and delay until playback (summary every 300 sounds).
bProbeSoundRequests=0
; Log threads, call intervals, and sample emitter positions of per-sound update (summary every 5s).
bProbeSoundUpdate=0
; Occlusion in mB on all 3D sounds (0 = off). -3000 is clearly muffled.
iTestOcclusion=0
; Key to toggle test occlusion while sounds play (0 = off). 0xC9 = Page Up.
iOcclusionTestKey=0
; Log how architecture set pieces of interior cells align on preset grid, for spatial optimization testing.
bProbeGrid=0
; Log which threads are used for engine-owned ray casts (summary every 30s).
bProbePickThreads=0
; Log occlusion changes for sounds and objects responsible for occlusion, and extended budget report.
bLogOcclusion=1
; Enable *the beeper*, continuously play beeping sound for console-selected ref and change tone by how occluded object is vs. player camera.
bOcclusionBeep=0
