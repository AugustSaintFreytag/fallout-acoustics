[Reverb]
; Enables sound processing through EAX+DSOAL.
bEnabled=1
; Master processed sound (wet) level in dB. 0 = preset level, positive = more, negative = less.
fWetLevel=0.0
; Boost every environment's room level in dB. 
; I3DL2 preset set to -10 dB. +10 adds up to 0 dB (max level).
fRoomBoost=0.0
; Boost radios placed in the world (host voices and songs) in dB, up to +10. Their reverb is set with fRadio3D in [Sends].
fRadioBoost=3.5
; Key to toggle all sound processing. (Default: End)
iBypassKey=0x23
; Environment used when a cell or worldspace has no set acoustic space.
; Names: Generic PaddedCell Room Bathroom Livingroom StoneRoom Auditorium ConcertHall Cave Arena Hangar
;        CarpetedHallway Hallway StoneCorridor Alley Forest City Mountains Quarry Plain ParkingLot SewerPipe
;        Underwater SmallRoom MediumRoom LargeRoom MediumHall LargeHall Plate
sInteriorFallback=MediumRoom
sExteriorFallback=City

[Sends]
; How much of each sound category goes into the reverb, in dB. 0 = full, -100 = none.
; UI sounds, ambient music and Pip-Boy radio are excluded by default.

; Voice lines spoken into the world (outside of dialogue).
fVoice3D=0.0
; Voice lines spoken in dialogue or by the player in 1st person.
fVoice2D=0.0
; Gunshots, reloads, weapon handling, casings.
fWeapons=0.0
; Player and NPC footstep sounds.
fFootsteps=-2.0
; Placed ambient sound emitters (buzzing, humming, water, machinery).
fLoops3D=-6.0
; Ambient sounds playing in 2D space (ambience, wind).
fLoops2D=-100.0
; Regional sounds (ambience).
fRegion=-100.0
; Radios placed in the world (host voices and songs). The Pip-Boy radio is always excluded.
fRadio3D=0.0
; All other sound categories playing in world space.
fDefault3D=0.0
; All other sound categories playing in 2D.
fDefault2D=0.0

[VoiceFilters]
; Filters voices spoken through face covers: cloth masks, gas masks, power armor helmets and intercoms.
; DSOAL does not support the vanilla voice modulation effect anyway, this is a net positive.
bEnabled=1

[Gunshots]
; Removes the reverb tail baked into gunshot sounds before they play. The reverb adds the room back.
; Gunshots are files in "sound\fx\wpn\" with "_fire" in the name. Loops and files with more than one shot are skipped.
bDeverb=1
; Share of the sound to keep at most. The rest is cut.
fKeepFraction=0.5
; Fade starts once the level stays this many dB below the peak (for 20 ms).
fFadeThreshold=3.0
; Latest fade start in seconds after the peak.
fMaxFadeDelay=0.25
; Fade steepness in dB per second.
fDecayRate=120
; A later peak within this many dB of the first one counts as another shot. The sound is then skipped.
fRepeatLevel=6.0

[Occlusion]
; Enables raycast-based occlusion probing to muffle sounds behind occluders (e.g. walls, buildings, vehicles, terrain).
; Supports all sound sources, including moving sources (like NPCs) and long-playing sources (like radios).
bEnabled=1
; High-frequency attenuation in dB for each wall layer between player and sound source.
; Seams, back-to-back walls and a door in its frame count as one layer.
fWallLevel=12.0
; Maximum possible attenuation from occlusion in dB.
fMaxOcclusion=75.0
; Share of attenuation on low frequencies and reverb.
fLFRatio=0.25
; Share of attenuation on the reverb output.
fRoomRatio=1.0
; Sounds further away (game units) are not checked.
fMaxDistance=4096
; Ray casts per frame (a single ray cast is typically 1-2 µs).
iRayBudget=64
; Seconds between two checks of the same sound.
fRefreshInterval=0.1
; Seconds for a change over the full range: attack = sound goes behind a wall, release = sound comes out.
fAttackTime=0.06
fReleaseTime=0.25
; Key to turn occlusion off and on (0 = no key). 0x22 = Page Down.
iBypassKey=0x22

[Distance]
; Factor on the distances over which the engine fades out 3D sounds. 1.0 = vanilla, 2.0 = sounds carry twice as far.
fDistanceAttenuationFactor=1.0

[Fixes]
; In vanilla doors and containers play their open/close sound twice: once 2D on use and typically again in 3D from the animation.
; This setting mutes the 2D sound for doors that are expected to have an animation (doors that play a sound that aren't level changers).
bFixDoubleOpenCloseSounds=1

[Debug]
; Override for environment selection (empty = off). Use something like "Hangar" for a max ear-blasting reverb.
sForceEnvironment=
; Log what OpenAL Soft stores in FX slot 0 and the first n routed sounds.
iReadbackCount=0
; Log every sound played by the engine. Also useful for mod pack debugging.
bLogSoundPlay=0
; Log every new sound environment on cell change.
bLogSoundEnvironment=0
; Scan the first n played sounds for DirectSound objects to debug object layout.
iLayoutProbeCount=0
; Defer EAX sound sets to batch them into one commit for performance.
bDeferEaxSets=0
; Log performance metrics on EAX routes.
bLogRouteTiming=0
; Log the face cover of every speaking NPC and the items on its head.
bLogVoiceCover=0
; Log each gunshot once: deverbed, or skipped with the reason.
bLogGunshots=1

; Occlusion tests. Off by default.
; Key that casts rays from the camera along the view and logs every hit (0 = off). 0x24 = Home.
iRayProbeKey=0
; Ray layers to test with one pass each. 37 = LineOfSight, 1 = Static, 6 = Projectile.
sRayProbeLayers=37, 1, 6
; Ray length in game units.
fRayProbeRange=4096
; Log which threads request sounds and the delay until they play (summary every 300 sounds).
bProbeSoundRequests=0
; Log threads and call intervals of the per-sound update with sample emitter positions (summary every 5 s).
bProbeSoundUpdate=0
; Occlusion in mB on all 3D sounds for a listening test (0 = off). -3000 is clearly muffled.
iTestOcclusion=0
; Key that turns the test occlusion on and off while sounds play (0 = off). 0x21 = Page Up.
iOcclusionTestKey=0
; Log how the architecture pieces of each interior cell align to a grid.
bProbeGrid=0
; Log which threads the engine casts its own Havok rays from (summary every 30 s).
bProbePickThreads=1
; Log each change of a sound's occlusion with the objects the rays found.
bLogOcclusion=1